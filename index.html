<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STUDENT REGISTRATION</title>
</head>
<body>
    
    <h1>student registration form</h1>

    <p1>WELCOME TO OUR STUDENT REGISTRATION PORTAL!</p1>
    <P1>PLEASE FILL IN ALL THE REQUIRED INFORMATION CAREFULLY</P1>
    <hr>
</header>
<main>
    <form><p>
        <label for="full name">full name:</label>
        <input type="text"id="full-name"name="full name"
        placeholder="Enter your first name"
                       required>
        </p> 

         <P>
            <label for="email">Email Address:</label>
            <input type="email"id="email"name="email"
            placeholder="example@email.com"
                         required>
         </P>

         <p>
            <label for="password">Password:</label>
            <input type="password"id="password"name="password"
            placeholder="create password"
                         required>

         </p>

         <p>
            <label for="phone">Phone Number:</label>
            <input type="tel"id="phone"name="phone"
            placeholder="03*********"
                         required>
         </p>

         <p>
            <label>Gender:</label><br>

            <input type="radio"id="male"name="gender"value="Male"
                        required>
                    <label for="male">Male</label>

           <input type="radio"id="female"name="gender"value="female">
                    <label for="female">Female</label>
                    
         </p>
                    
         <p>
            <label for="dob">Date of birth</label>
            <input type="date"id="dob"name="date of birth"
                         required>

         </p>
         
         <p>
            <label for="course">Select Your Course:</label><br>

            <select id="course"name="course"required>
                <option value=""selected disabled>
                             --choose a course--
                </option>      
            
         <option value="CIT">CIT</option>
         <option value="Web Development">Web Development</option>
         <option value="Graphic Designing">Graphic Designing</option>
             </select>
         </p>

         <p>
            <label for="address">Address</label><br>

            <textarea id="address"name="address"rows="4"col="35"
            placeholder="Enter your complete address"
                         required></textarea>
         </p>

         <p>
            <label>Select Your Hobbies:</label><br>

            <input type="checkbox"id="reading"name="hobbies"value="Reading">
            <label for="reading">Reading</label><br>

            <input type="checkbox"id="coding"name="hobbies"value="Coding">
            <label for="coding">Coding</label><br>

            <input type="checkbox"id="Designing"name="hobbies"value="Designing">
            <label for="Designing">Designing</label><br>

            <input type="checkbox"id="sport"name="hobbies"value="sports">
            <label for="sports">Sports</label>
         </p>

         <p>
            <button type="submit">Submit Registration</button>
            <button type="reset">Reset Form</button>
         </p>
         <footer>
            <hr>
            <p>THANK YOU FOR YOUR INTEREST IN LEARNING WITH US!</p>
            <P>&copy; 2026 STUDENT REGISTRATION PORTAL</P>
         </footer>
    </form>
</main>

        <footer>
        
        </footer>

                
</body>
</html>
